# Build the Astro site and publish it to GitHub Pages.
#
# Runs on every push to `main` and can also be triggered manually from the
# Actions tab. GitHub Pages is configured with build_type: workflow, so
# the site swap happens the moment `deploy-pages` finishes successfully.
# The `public/CNAME` file (containing `ayden.ai`) is copied into `dist/`
# by Astro's build, which is what keeps the custom-domain binding intact.

name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow a single deploy at a time. Don't cancel a run mid-flight — a
# partial deploy would take the site down.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
